<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inscrição simulada</title></head>
<body><main><h1>Oficina comunitária</h1><p>Exercício local: utilize somente dados fictícios.</p>
<form action="#" method="get">
  <label for="apelido">Nome fictício (3 a 20 letras)</label>
  <input id="apelido" name="apelido" minlength="3" maxlength="20" required>
  <fieldset><legend>Turno</legend>
    <label><input type="radio" name="turno" value="manha" required>Manhã</label>
    <label><input type="radio" name="turno" value="tarde">Tarde</label>
  </fieldset>
  <!-- Acrescente um campo numérico, de data e uma dica de formato -->
  <button type="submit">Validar preenchimento</button>
</form>
</main></body></html>
