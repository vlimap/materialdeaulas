<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pré-inscrição</title></head>
<body>
<main><h1>Pré-inscrição em oficina</h1>
<p>Exercício local: não informe dados pessoais reais.</p>
<form action="#" method="get">
  <label for="apelido">Nome fictício</label>
  <input id="apelido" name="apelido" type="text">
  <fieldset><legend>Turno preferido</legend>
    <label><input type="radio" name="turno" value="manha"> Manhã</label>
    <label><input type="radio" name="turno" value="noite"> Noite</label>
  </fieldset>
  <!-- Inclua select para o tema e textarea para observações. -->
  <button type="submit">Simular envio</button>
</form></main>
</body></html>
