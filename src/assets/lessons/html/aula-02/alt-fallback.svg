<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fallback de imagem e texto alternativo</title>
  <desc id="desc">Comparação visual entre imagem carregada, imagem indisponível com alternativa textual e imagem decorativa.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#061b3a" flood-opacity=".12"/>
    </filter>
    <style>
      .panel{filter:url(#shadow);transform-box:fill-box;transform-origin:center;animation:float 5s ease-in-out infinite}
      .panel:nth-of-type(2){animation-delay:.45s}.panel:nth-of-type(3){animation-delay:.9s}
      .code{font-family:Consolas,monospace;font-weight:700;font-size:22px;fill:#0d47a1}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:22px;fill:#292929}
      .muted{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#7e7e7e}
      .scan{animation:scan 4.8s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes scan{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(160px);opacity:1}}
      @media(prefers-reduced-motion:reduce){.panel,.scan{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="675" rx="36" fill="#f5f6f8"/>
  <rect x="55" y="48" width="1090" height="579" rx="34" fill="#fff" stroke="#d4d4d4" stroke-width="2"/>

  <g class="panel" transform="translate(95 132)">
    <rect width="300" height="390" rx="28" fill="#fff" stroke="#b3c9dd" stroke-width="3"/>
    <rect x="22" y="22" width="256" height="182" rx="20" fill="#e6edf4"/>
    <circle cx="90" cy="90" r="34" fill="#f7df1e"/>
    <path d="M46 178l66-62 52 42 42-36 50 56z" fill="#1565c0"/>
    <rect x="22" y="228" width="256" height="64" rx="16" fill="#061b3a"/>
    <text x="150" y="268" text-anchor="middle" font-family="Consolas,monospace" font-size="20" font-weight="700" fill="#fff">alt="..."</text>
    <text x="22" y="332" class="label">Imagem informativa</text>
    <text x="22" y="362" class="muted">conteúdo visual percebido</text>
  </g>

  <g class="panel" transform="translate(450 132)">
    <rect width="300" height="390" rx="28" fill="#fff" stroke="#b3c9dd" stroke-width="3"/>
    <rect x="22" y="22" width="256" height="182" rx="20" fill="#f3f4f6" stroke="#d4d4d4" stroke-width="3" stroke-dasharray="10 10"/>
    <path d="M82 78l136 72M218 78L82 150" stroke="#aaaaaa" stroke-width="10" stroke-linecap="round"/>
    <g class="scan">
      <rect x="42" y="164" width="58" height="10" rx="5" fill="#f7df1e"/>
    </g>
    <rect x="22" y="228" width="256" height="64" rx="16" fill="#e6edf4"/>
    <text x="150" y="268" text-anchor="middle" class="code">alt="descrição"</text>
    <text x="22" y="332" class="label">Imagem indisponível</text>
    <text x="22" y="362" class="muted">o significado continua</text>
  </g>

  <g class="panel" transform="translate(805 132)">
    <rect width="300" height="390" rx="28" fill="#fff" stroke="#b3c9dd" stroke-width="3"/>
    <rect x="22" y="22" width="256" height="182" rx="20" fill="#061b3a"/>
    <g fill="#f7df1e">
      <circle cx="80" cy="78" r="14"/><circle cx="150" cy="112" r="12"/><circle cx="218" cy="72" r="16"/>
      <path d="M67 151l13-25 13 25 25 13-25 13-13 25-13-25-25-13z"/>
      <path d="M204 145l8-15 8 15 15 8-15 8-8 15-8-15-15-8z"/>
    </g>
    <rect x="22" y="228" width="256" height="64" rx="16" fill="#e6edf4"/>
    <text x="150" y="268" text-anchor="middle" class="code">alt=""</text>
    <text x="22" y="332" class="label">Imagem decorativa</text>
    <text x="22" y="362" class="muted">não adiciona informação</text>
  </g>

  <rect x="130" y="88" width="164" height="12" rx="6" fill="#0d47a1"/>
  <rect x="310" y="88" width="94" height="12" rx="6" fill="#6693bb"/>
  <circle cx="1072" cy="91" r="22" fill="#f7df1e"/>
</svg>