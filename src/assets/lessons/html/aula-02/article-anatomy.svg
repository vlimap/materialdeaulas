<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura de um artigo HTML</title>
  <desc id="desc">Página de artigo composta por título, subtítulo, parágrafos, citação, código e divisões textuais.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#061b3a" flood-opacity=".14"/>
    </filter>
    <style>
      .block{transform-box:fill-box;transform-origin:center;animation:enter 5.8s ease-in-out infinite}
      .b2{animation-delay:.18s}.b3{animation-delay:.36s}.b4{animation-delay:.54s}.b5{animation-delay:.72s}
      .scan{animation:scan 4s ease-in-out infinite}
      @keyframes enter{0%,100%{transform:translateX(0);opacity:1}50%{transform:translateX(8px);opacity:.88}}
      @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(95px)}}
      @media(prefers-reduced-motion:reduce){.block,.scan{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="675" rx="36" fill="#f5f6f8"/>
  <g filter="url(#shadow)">
    <rect x="130" y="58" width="940" height="560" rx="34" fill="#fff" stroke="#d4d4d4" stroke-width="2"/>
  </g>

  <rect x="130" y="58" width="940" height="64" rx="34" fill="#061b3a"/>
  <circle cx="170" cy="90" r="8" fill="#f7df1e"/>
  <circle cx="198" cy="90" r="8" fill="#7296fc"/>
  <circle cx="226" cy="90" r="8" fill="#1565c0"/>

  <g class="block">
    <rect x="190" y="156" width="510" height="28" rx="14" fill="#0d47a1"/>
    <rect x="190" y="199" width="340" height="14" rx="7" fill="#6693bb"/>
    <rect x="190" y="229" width="250" height="10" rx="5" fill="#d4d4d4"/>
    <rect x="782" y="156" width="170" height="40" rx="12" fill="#e6edf4"/>
    <text x="867" y="183" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="22" fill="#0d47a1">&lt;h1&gt;</text>
  </g>

  <g class="block b2">
    <rect x="190" y="282" width="670" height="12" rx="6" fill="#aaaaaa"/>
    <rect x="190" y="310" width="610" height="12" rx="6" fill="#d4d4d4"/>
    <rect x="190" y="338" width="648" height="12" rx="6" fill="#d4d4d4"/>
    <rect x="882" y="300" width="70" height="38" rx="11" fill="#1565c0"/>
    <text x="917" y="326" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="20" fill="#fff">&lt;p&gt;</text>
  </g>

  <g class="block b3">
    <rect x="214" y="390" width="610" height="86" rx="18" fill="#e6edf4"/>
    <rect x="214" y="390" width="9" height="86" rx="5" fill="#f7df1e"/>
    <rect x="248" y="414" width="460" height="11" rx="6" fill="#6693bb"/>
    <rect x="248" y="441" width="350" height="10" rx="5" fill="#b3c9dd"/>
    <rect x="844" y="414" width="108" height="38" rx="11" fill="#061b3a"/>
    <text x="898" y="440" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="17" fill="#fff">&lt;blockquote&gt;</text>
  </g>

  <g class="block b4">
    <rect x="190" y="510" width="510" height="72" rx="18" fill="#061b3a"/>
    <rect x="220" y="532" width="220" height="10" rx="5" fill="#7296fc"/>
    <rect x="220" y="554" width="320" height="10" rx="5" fill="#1565c0"/>
    <rect x="720" y="527" width="92" height="38" rx="11" fill="#f7df1e"/>
    <text x="766" y="553" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="20" fill="#292929">&lt;pre&gt;</text>
    <rect x="828" y="527" width="96" height="38" rx="11" fill="#0d47a1"/>
    <text x="876" y="553" text-anchor="middle" font-family="Consolas,monospace" font-weight="700" font-size="20" fill="#fff">&lt;code&gt;</text>
  </g>

  <g class="scan">
    <rect x="984" y="154" width="10" height="40" rx="5" fill="#f7df1e"/>
  </g>
</svg>