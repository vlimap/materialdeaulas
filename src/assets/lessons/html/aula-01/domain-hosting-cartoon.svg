  <rect class="s" width="360" height="390" rx="24"/><rect class="s" x="52" y="50" width="256" height="62" rx="12"/><rect class="s" x="52" y="138" width="256" height="62" rx="12"/><rect class="s" x="52" y="226" width="256" height="62" rx="12"/>
