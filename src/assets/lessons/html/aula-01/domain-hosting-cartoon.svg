<style>.s{fill:#fff;stroke:#111;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.t{font-family:Arial,sans-serif;font-weight:700;fill:#111}.a{stroke-dasharray:14 14;animation:dash 4s linear infinite}@keyframes dash{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.a{animation:none}}</style>
